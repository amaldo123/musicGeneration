[mypy]
# Global settings
python_version = 3.11
ignore_missing_imports = True
warn_return_any = False
warn_unused_configs = True
files = aimusic, tests

# Ignore errors in core/complex modules while in early development
# This allows the CI to pass even if types aren't perfect yet.
[mypy-aimusic.scoring.priors.*,aimusic.scoring.gttm_features.*,aimusic.core.vocab.*,aimusic.core.core_types.*]
ignore_errors = True
